# Shared, portable defaults. Put machine-specific ports or probe serial
# numbers in config.local.ini; that file is loaded last and is not committed.

[app]
task = cir_monitor
device = follower

[device.follower]
port = auto
baudrate = 5000000
timeout_s = 0.1
vid = 0x0483
pid = 0x3754
serial_number =
description_contains =
expected_board = Follower-Full
expected_role = DO-Follower

[device.leader]
port = auto
baudrate = 5000000
timeout_s = 0.1
vid = 0x0483
pid = 0x3754
serial_number =
description_contains =
expected_board = Leader-UwbOnly
expected_role = DO-Leader

[device.sts_rx]
port = auto
baudrate = 5000000
timeout_s = 0.1
vid = 0x0483
pid = 0x3754
serial_number =
description_contains =
expected_board = Full-SiT5156
expected_role = UWB-STS-Dual-RX-Diagnostic

[device.sts_tx]
port = auto
baudrate = 5000000
timeout_s = 0.1
vid = 0x0483
pid = 0x3754
serial_number =
description_contains =
expected_board = UWB-RF1-SiT5156
expected_role = UWB-STS-TX-Diagnostic

[storage]
capture_directory = captures
filename_template = {timestamp}_{device}_{task}.hcir

[task.cir_monitor]
record = true
record_path =
rolling_window = 200

[task.serial_probe]
duration_s = 10
preview_bytes = 256
report_interval_s = 1
save = true
output =

[task.raw_record]
output =

[task.capture_inspect]
path = latest
limit = 3
cir_radius = 4
frame_bytes = 32

[task.static_timing_analysis]
path = latest
limit = 0
rf_port =
histogram_bin_dtu = 1
histogram_min_half_range_ns = 10
view_pre_ns = 30
view_post_ns = 100
correlation_mode = complex
correlation_template_frames = 50
correlation_window_start_ns = -10
correlation_window_stop_ns = 80
correlation_search_half_range_ns = 10
correlation_interpolation_step_dtu = 4
correlation_noise_percentile = 20
export_csv = true
csv_path =
show = true

[task.spatial_timing_analysis]
path = latest
limit = 0
histogram_bin_dtu = 1
template_frames = 50
maximum_landmarks = 8
landmark_window_samples = 13
landmark_min_separation_samples = 10
search_half_range_ns = 10
interpolation_step_dtu = 4
minimum_match_score = 0.60
minimum_consensus_inliers = 2
consensus_half_range_ns = 0.75
minimum_rank_one_score = 0.35
minimum_track_reliability = 0.55
correlation_mode = complex
correlation_noise_percentile = 20
correlation_dynamic_range_db = 30
clock_drift_mode = linear
export_csv = true
csv_path =
show = true

[task.replay]
path = latest
speed = 1.0
rolling_window = 200

[task.list_ports]
