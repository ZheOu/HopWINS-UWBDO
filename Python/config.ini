# Shared, portable defaults. Put machine-specific ports or probe serial
# numbers in config.local.ini; that file is loaded last and is not committed.

[app]
task = cir_monitor
device = follower

[device.follower]
port = auto
baudrate = 5000000
timeout_s = 0.1
vid = 0x0483
pid = 0x3754
serial_number =
description_contains =
expected_board = Follower-Full
expected_role = DO-Follower

[device.leader]
port = auto
baudrate = 5000000
timeout_s = 0.1
vid = 0x0483
pid = 0x3754
serial_number =
description_contains =
expected_board = Leader-UwbOnly
expected_role = DO-Leader

[storage]
capture_directory = captures
filename_template = {timestamp}_{device}_{task}.hcir

[task.cir_monitor]
record = true
record_path =
rolling_window = 200

[task.raw_record]
output =

[task.capture_inspect]
path = latest
limit = 3
cir_radius = 4
frame_bytes = 32

[task.replay]
path = latest
speed = 1.0
rolling_window = 200

[task.list_ports]
